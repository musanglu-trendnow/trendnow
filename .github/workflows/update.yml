name: 실시간 검색어 업데이트

on:
  schedule:
    - cron: "7 * * * *"   # 매시 7분 (UTC 기준, 1시간마다)
  workflow_dispatch:       # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: trends
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 트렌드 수집 및 페이지 생성
        run: node scripts/update.mjs
      - name: 변경사항 커밋
        run: |
          git config user.name "trend-bot"
          git config user.email "trend-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "실검 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
